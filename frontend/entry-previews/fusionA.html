<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>入场页 · 融合A 全融合</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, "PingFang SC", sans-serif; }
  body { background: linear-gradient(180deg, #060608 0%, #0a0a0f 55%, #150810 100%); cursor: pointer; perspective: 340px; }

  /* 底层:赛博地平线 + 透视网格(压暗做氛围) */
  .glowsky { position: fixed; left: 0; right: 0; top: 34%; height: 26%; z-index: 1; opacity: 0;
    background: radial-gradient(ellipse at 50% 100%, rgba(255,106,0,.28), rgba(238,9,121,.1) 50%, transparent 75%);
    transition: opacity 1.1s ease; }
  .horizon { position: fixed; left: 0; right: 0; top: 60%; height: 2px; z-index: 2; opacity: 0; transform: scaleX(.2);
    background: linear-gradient(90deg, transparent, #ff6a00 30%, #ee0979 70%, transparent);
    box-shadow: 0 0 34px 6px rgba(255,106,0,.45), 0 0 70px 16px rgba(238,9,121,.25);
    transition: opacity .9s ease, transform 1.2s cubic-bezier(.16,1,.3,1); }
  .grid { position: fixed; left: -50%; right: -50%; top: 60%; bottom: -10%; z-index: 1; opacity: 0;
    background-image: linear-gradient(rgba(255,106,0,.22) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(238,9,121,.16) 1px, transparent 1px);
    background-size: 72px 72px; transform: rotateX(74deg) translateZ(-40px); transform-origin: top center;
    animation: gridmove 5s linear infinite; transition: opacity 1.3s ease .2s;
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 35%); mask-image: linear-gradient(180deg, transparent, #000 35%); }
  @keyframes gridmove { from { background-position: 0 0; } to { background-position: 0 72px; } }

  canvas { position: fixed; inset: 0; z-index: 3; }
  /* 鼠标光晕职照 */
  .spot { position: fixed; width: 480px; height: 480px; border-radius: 50%; z-index: 2; pointer-events: none;
    transform: translate(-50%,-50%); opacity: 0; transition: opacity .6s ease;
    background: radial-gradient(circle, rgba(255,138,61,.16), rgba(238,9,121,.06) 40%, transparent 70%); }

  .content { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 5; pointer-events: none; padding-bottom: 6vh; }
  .title { font-size: clamp(2.2rem, 7vw, 5.5rem); font-weight: 800; letter-spacing: .04em; opacity: 0;
    background: linear-gradient(90deg, #fff 10%, #ffcaa6 45%, #ff6a00 70%, #ee0979 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 60px rgba(255,106,0,.25); }
  .sub { margin-top: 1.2rem; font-size: clamp(.85rem, 1.6vw, 1.15rem); letter-spacing: .5em; opacity: 0;
    color: rgba(255,255,255,.55); font-weight: 300; padding-left: .5em; }
  .enter { margin-top: 20vh; font-size: clamp(1rem, 2.2vw, 1.5rem); font-weight: 500; opacity: 0;
    letter-spacing: .35em; padding-left: .35em; color: #fff; }
</style>
</head>
<body>
  <div class="glowsky" id="sky"></div>
  <div class="grid" id="grid"></div>
  <div class="horizon" id="horizon"></div>
  <canvas id="c"></canvas>
  <div class="spot" id="spot"></div>
  <div class="content">
    <h1 class="title" id="title">YOLO26 FITNESS AGENT</h1>
    <p class="sub" id="sub">你的实时 AI 健身教练</p>
    <div class="enter" id="enter">点击进入</div>
  </div>
<script>
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const spot = document.getElementById('spot');
  let W, H, pts = [], mouse = { x: -999, y: -999 }, litCount = 0;
  function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
  resize(); addEventListener('resize', resize);
  const N = Math.min(85, Math.floor(innerWidth / 18));
  for (let i = 0; i < N; i++) pts.push({
    x: Math.random() * W, y: Math.random() * H * .9,
    vx: (Math.random() - .5) * .3, vy: (Math.random() - .5) * .3,
    r: Math.random() * 1.8 + 1, lit: false, order: Math.random()
  });
  pts.sort((a, b) => a.order - b.order);
  addEventListener('mousemove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    spot.style.left = e.clientX + 'px'; spot.style.top = e.clientY + 'px';
  });
  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (let k = 0; k < N; k++) {
      const p = pts[k]; if (!p.lit) continue;
      p.x += p.vx; p.y += p.vy;
      // 吸附:鼠标附近节点轻微聚拢
      const dm = Math.hypot(p.x - mouse.x, p.y - mouse.y);
      if (dm < 190 && dm > 1) { const f = (1 - dm / 190) * 1.1; p.x -= (p.x - mouse.x) / dm * f; p.y -= (p.y - mouse.y) / dm * f; }
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H * .92) p.vy *= -1;
    }
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      if (!pts[i].lit || !pts[j].lit) continue;
      const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
      if (d < 135) {
        const mx = (pts[i].x + pts[j].x) / 2, my = (pts[i].y + pts[j].y) / 2;
        const near = Math.hypot(mx - mouse.x, my - mouse.y) < 160;
        const a = (1 - d / 135) * (near ? .9 : .4);
        const g = ctx.createLinearGradient(pts[i].x, pts[i].y, pts[j].x, pts[j].y);
        g.addColorStop(0, `rgba(255,106,0,${a})`); g.addColorStop(1, `rgba(238,9,121,${a})`);
        ctx.strokeStyle = g; ctx.lineWidth = near ? 1.3 : .6;
        ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke();
      }
    }
    for (let k = 0; k < N; k++) {
      const p = pts[k]; if (!p.lit) continue;
      const near = Math.hypot(p.x - mouse.x, p.y - mouse.y) < 160;
      ctx.beginPath(); ctx.arc(p.x, p.y, near ? p.r + 1 : p.r, 0, 6.28);
      ctx.fillStyle = near ? 'rgba(255,200,150,.95)' : 'rgba(255,150,90,.8)';
      ctx.shadowColor = '#ff6a00'; ctx.shadowBlur = near ? 14 : 7; ctx.fill();
    }
    ctx.shadowBlur = 0;
    requestAnimationFrame(tick);
  }
  tick();

  // 编排式逐层入场
  function seq() {
    document.getElementById('sky').style.opacity = 1;
    setTimeout(() => { document.getElementById('horizon').style.opacity = 1;
      document.getElementById('horizon').style.transform = 'scaleX(1)'; }, 300);
    setTimeout(() => document.getElementById('grid').style.opacity = 1, 600);
    // 粒子逐个点亮组网
    setTimeout(() => {
      let i = 0;
      const iv = setInterval(() => { if (i >= N) return clearInterval(iv); pts[i++].lit = true; }, 22);
    }, 900);
    // 标题/副标/进入依次浮现
    const fade = (el, d) => setTimeout(() => {
      el.style.transition = 'opacity 1.2s cubic-bezier(.16,1,.3,1), transform 1.2s cubic-bezier(.16,1,.3,1)';
      el.style.opacity = 1; el.style.transform = 'none';
    }, d);
    [['title', 1500], ['sub', 1750]].forEach(([id, d]) => {
      const el = document.getElementById(id); el.style.transform = 'translateY(24px)'; fade(el, d);
    });
    setTimeout(() => { spot.style.opacity = 1; const e = document.getElementById('enter');
      e.style.transition = 'opacity 1s'; e.style.opacity = 1; e.style.animation = 'breathe 2.6s ease-in-out infinite'; }, 2100);
  }
  const style = document.createElement('style');
  style.textContent = '@keyframes breathe{0%,100%{opacity:.25;text-shadow:0 0 8px rgba(255,255,255,.1)}50%{opacity:1;text-shadow:0 0 24px rgba(255,138,61,.7),0 0 48px rgba(238,9,121,.4)}}';
  document.head.appendChild(style);
  seq();

  document.body.addEventListener('click', e => {
    if (document.body.classList.contains('leaving')) return;
    const r = document.createElement('div');
    r.style.cssText = 'position:fixed;border-radius:50%;z-index:20;pointer-events:none;transform:translate(-50%,-50%) scale(0);'
      + 'background:radial-gradient(circle,rgba(255,138,61,.9),rgba(238,9,121,.5) 40%,transparent 70%);'
      + 'animation:ripple 1.1s cubic-bezier(.16,1,.3,1) forwards;';
    const s = Math.max(W, H) * .12; r.style.width = r.style.height = s + 'px';
    r.style.left = e.clientX + 'px'; r.style.top = e.clientY + 'px';
    document.body.appendChild(r);
    const rs = document.createElement('style');
    rs.textContent = '@keyframes ripple{to{transform:translate(-50%,-50%) scale(28);opacity:0}}';
    document.head.appendChild(rs);
    document.body.classList.add('leaving');
    document.querySelectorAll('canvas,.content,.glowsky,.grid,.horizon,.spot').forEach(el => {
      el.style.transition = 'opacity .9s ease .25s'; el.style.opacity = 0; });
  });
</script>

</body>
</html>
